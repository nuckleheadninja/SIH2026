name: OCR Module CI

on:
  push:
    paths:
      - 'ocr_module/**'
      - 'shared/**'
      - '.github/workflows/test-ocr.yml'
  pull_request:
    paths:
      - 'ocr_module/**'
      - 'shared/**'
      - '.github/workflows/test-ocr.yml'

jobs:
  test-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema -r ocr_module/requirements.txt
      - name: Run OCR Module Tests
        run: |
          pytest ocr_module/tests/ shared/tests/
