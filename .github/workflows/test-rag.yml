name: Legal Metrology RAG CI

on:
  push:
    paths:
      - 'legal_metrology_rag/**'
      - 'shared/**'
      - '.github/workflows/test-rag.yml'
  pull_request:
    paths:
      - 'legal_metrology_rag/**'
      - 'shared/**'
      - '.github/workflows/test-rag.yml'

jobs:
  test-rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema pyyaml -r legal_metrology_rag/requirements.txt
      - name: Run RAG Module Tests
        run: |
          pytest legal_metrology_rag/tests/ legal_metrology_rag/domains/legal_metrology/tests/ legal_metrology_rag/domains/fssai/tests/
